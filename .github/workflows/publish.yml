name: Publish to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Require a release version
        shell: bash
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "Set a release version before publishing to Maven Central."
            exit 1
          fi

      - name: Import GPG Key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: python3 .github/scripts/import_gpg_key.py

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
        run: |
          mvn clean deploy -P release --batch-mode -DskipTests -Dgpg.passphrase="" -Dmaven.deploy.skip=true -Dcentral-publishing-maven-plugin.skipPublishing=true
          python3 .github/scripts/package_and_publish.py
