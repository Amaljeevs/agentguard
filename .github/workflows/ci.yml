name: CI Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install --batch-mode --no-transfer-progress

      - name: Verify candidate over real MCP transport
        run: mvn -f agentguard-examples/spring-ai-mcp-server/pom.xml verify --batch-mode --no-transfer-progress

      - name: Test declarative policy scenarios
        run: >-
          mvn -f agentguard-policy/pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=io.agentguard.policy.testing.PolicyTestCli
          '-Dexec.args=agentguard-examples/spring-ai-mcp-server/src/main/resources/agentguard-policy.yaml specification/examples/policy-scenarios.json'

  published-consumers:
    name: Published 0.1.0 / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [published-dependency-example, h2-orders-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve and test the published release independently
        run: mvn -f agentguard-examples/${{ matrix.example }}/pom.xml clean verify --batch-mode --no-transfer-progress
