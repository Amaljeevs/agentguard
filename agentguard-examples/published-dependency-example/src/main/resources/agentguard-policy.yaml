version: "1.0"
metadata:
  name: published-dependency-demo
roles:
  developer:
    permissions: ["database.query"]
  devops:
    permissions: ["kubernetes.deploy"]
rules:
  - id: deny-dev-prod-db
    effect: DENY
    target:
      roles: ["developer"]
      actions: ["database.query"]
      conditions:
        environment:
          equals: production
  - id: prod-deploy-approval
    effect: APPROVAL_REQUIRED
    target:
      actions: ["kubernetes.deploy"]
      conditions:
        environment:
          equals: production
